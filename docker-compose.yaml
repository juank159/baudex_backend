version: '3.9'

services:
  # Base de datos PostgreSQL
  db:
    image: postgres:15.3
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
    container_name: baudex_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - baudex_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Aplicación NestJS
  app:
    image: node:20-alpine
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
    container_name: baudex_app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - baudex_network
    working_dir: /usr/src/app
    volumes:
      # Para desarrollo: montar código fuente para hot-reload
      - .:/usr/src/app
      - /usr/src/app/node_modules
    command: sh -c "npm install && npm run start:dev"

  # pgAdmin para administración
  pgadmin:
    image: dpage/pgadmin4
    restart: always
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    container_name: baudex_pgadmin
    depends_on:
      - db
    networks:
      - baudex_network

networks:
  baudex_network:
    driver: bridge

volumes:
  postgres_data:
